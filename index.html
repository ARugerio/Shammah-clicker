<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAMMAH Clicker Studio | Bambu Lab P2S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        const saved = localStorage.getItem('clicker-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- El esqueleto (barra superior, visor, drawers y dock) lo construye createShell() -->
    <div id="shell-root"></div>

    <!-- CARGA DEL MOTOR PRINCIPAL -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
